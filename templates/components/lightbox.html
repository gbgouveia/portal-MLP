<div id="mlp-lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Visualizador de fotografias históricas">
  <div class="lightbox-content">
    <button class="lightbox-close" aria-label="Fechar visualização de imagem (ESC)">&times;</button>
    <img src="" alt="" class="lightbox-image">
    <div class="lightbox-caption-box">
      <p class="lightbox-caption font-serif" style="font-size: 1.05rem; margin-bottom: 0.35rem;"></p>
      <span class="lightbox-author" style="font-size: 0.8rem; color: var(--color-gold-light); letter-spacing: 0.05em;"></span>
    </div>
  </div>
</div>
