{% load static %}
<!-- ==========================================================================
     MAC OS DOCK AUXILIAR — MINISTÉRIO LUZ DA PALAVRA
     Referência 21st.dev: mac-os-dock.tsx adaptado para Django Templates
     Navegação rápida, ampliação harmônica por cursor e tooltips acessíveis.
     ========================================================================== -->
<div class="mlp-dock-container" role="region" aria-label="Navegação rápida do portal">
  <nav class="mlp-dock" role="navigation" aria-label="Acesso rápido aos módulos">
    
    <!-- 1. Início -->
    <a href="{% url 'public:home' %}" 
       class="mlp-dock-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
       {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}
       aria-label="Página Inicial do Ministério Luz da Palavra">
      <span class="mlp-dock-tooltip" role="tooltip">Início</span>
      <div class="mlp-dock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span class="mlp-dock-dot" aria-hidden="true"></span>
    </a>

    <!-- 2. História Institucional -->
    <a href="{% url 'public:history' %}" 
       class="mlp-dock-item {% if request.resolver_match.url_name == 'history' %}active{% endif %}"
       {% if request.resolver_match.url_name == 'history' %}aria-current="page"{% endif %}
       aria-label="Nossa História Institucional">
      <span class="mlp-dock-tooltip" role="tooltip">História</span>
      <div class="mlp-dock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <span class="mlp-dock-dot" aria-hidden="true"></span>
    </a>

    <!-- 3. Legado do Pastor Leonel -->
    <a href="{% url 'public:legacy' %}" 
       class="mlp-dock-item {% if request.resolver_match.url_name == 'legacy' %}active{% endif %}"
       {% if request.resolver_match.url_name == 'legacy' %}aria-current="page"{% endif %}
       aria-label="O Legado Pastoral do Pastor Leonel">
      <span class="mlp-dock-tooltip" role="tooltip">Legado Pr. Leonel</span>
      <div class="mlp-dock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="12 6 12 12 16 14"></polygon>
        </svg>
      </div>
      <span class="mlp-dock-dot" aria-hidden="true"></span>
    </a>

    <!-- 4. Agenda e Cultos -->
    <a href="{% url 'public:events' %}" 
       class="mlp-dock-item {% if 'event' in request.resolver_match.url_name %}active{% endif %}"
       {% if 'event' in request.resolver_match.url_name %}aria-current="page"{% endif %}
       aria-label="Agenda de Cultos e Celebrações">
      <span class="mlp-dock-tooltip" role="tooltip">Cultos & Agenda</span>
      <div class="mlp-dock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <span class="mlp-dock-dot" aria-hidden="true"></span>
    </a>

    <!-- 5. Acervo Fotográfico -->
    <a href="{% url 'public:gallery' %}" 
       class="mlp-dock-item {% if 'gallery' in request.resolver_match.url_name or 'album' in request.resolver_match.url_name %}active{% endif %}"
       {% if 'gallery' in request.resolver_match.url_name or 'album' in request.resolver_match.url_name %}aria-current="page"{% endif %}
       aria-label="Acervo Fotográfico Documental">
      <span class="mlp-dock-tooltip" role="tooltip">Acervo Fotográfico</span>
      <div class="mlp-dock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </div>
      <span class="mlp-dock-dot" aria-hidden="true"></span>
    </a>

    <!-- 6. Mensagens e Pregações Gravadas / Ao Vivo -->
    <a href="{% url 'public:media' %}" 
       class="mlp-dock-item {% if 'media' in request.resolver_match.url_name %}active{% endif %}"
       {% if 'media' in request.resolver_match.url_name %}aria-current="page"{% endif %}
       aria-label="Biblioteca Audiovisual e Transmissões">
      <span class="mlp-dock-tooltip" role="tooltip">Mensagens & Ao Vivo</span>
      <div class="mlp-dock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </div>
      <span class="mlp-dock-dot" aria-hidden="true"></span>
    </a>

    <!-- 7. Contato e Localização -->
    <a href="{% url 'public:contact' %}" 
       class="mlp-dock-item {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
       {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}
       aria-label="Contato Oficial e Localização">
      <span class="mlp-dock-tooltip" role="tooltip">Contato</span>
      <div class="mlp-dock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <span class="mlp-dock-dot" aria-hidden="true"></span>
    </a>

  </nav>
</div>
